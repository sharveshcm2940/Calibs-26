<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPhoto" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#191512" />
      <stop offset="50%" stop-color="#0B0A09" />
      <stop offset="100%" stop-color="#30150B" />
    </linearGradient>
  </defs>

  <rect width="400" height="600" fill="url(#bgPhoto)" />
  <rect x="18" y="18" width="364" height="564" fill="none" stroke="#C69A45" stroke-width="1.5" />

  <text x="200" y="55" font-family="'Barlow Condensed', Impact, sans-serif" font-size="12" font-weight="bold" fill="#C69A45" text-anchor="middle" letter-spacing="5">
    THE 35MM RETROSPECTIVE
  </text>
  <line x1="80" y1="65" x2="320" y2="65" stroke="#C69A45" stroke-width="1" opacity="0.6" />

  <!-- Camera Lens & Aperture Rings -->
  <g transform="translate(200, 240)">
    <circle cx="0" cy="0" r="95" fill="#141210" stroke="#C69A45" stroke-width="3" />
    <circle cx="0" cy="0" r="80" fill="#0B0A09" stroke="#5A1116" stroke-width="6" />
    <circle cx="0" cy="0" r="60" fill="none" stroke="#F1E4C5" stroke-width="2" stroke-dasharray="6 3" />
    <!-- Aperture Blades -->
    <polygon points="0,-40 35,-15 15,25 -25,25 -35,-15" fill="#A51D24" opacity="0.4" />
    <circle cx="0" cy="0" r="28" fill="#F1E4C5" />
    <circle cx="0" cy="0" r="10" fill="#0B0A09" />
  </g>

  <!-- Tamil Script -->
  <text x="200" y="385" font-family="'Cinzel', serif" font-size="14" fill="#C69A45" text-anchor="middle" letter-spacing="6">
    புகைப்படக் கலை
  </text>

  <text x="200" y="425" font-family="'Barlow Condensed', Impact, sans-serif" font-size="44" font-weight="900" fill="#F1E4C5" text-anchor="middle" letter-spacing="2">
    PHOTOGRAPHY
  </text>
  <text x="200" y="450" font-family="'Barlow Condensed', Impact, sans-serif" font-size="14" font-weight="bold" fill="#A51D24" text-anchor="middle" letter-spacing="4">
    THROUGH THE 35MM LENS
  </text>

  <rect x="35" y="480" width="330" height="75" fill="#0B0A09" stroke="#C69A45" stroke-width="1" opacity="0.85" />
  <text x="50" y="508" font-family="'Courier New', monospace" font-size="11" fill="#F1E4C5" letter-spacing="1">VENUE: CAMPUS GROUNDS</text>
  <text x="50" y="528" font-family="'Courier New', monospace" font-size="11" fill="#C69A45" letter-spacing="1">CALL TIME: 09:30 AM</text>
  <text x="50" y="546" font-family="'Courier New', monospace" font-size="11" fill="#A51D24" letter-spacing="1">FORMAT: RAW + COLOR GRADED</text>
</svg>
