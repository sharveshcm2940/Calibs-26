<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDrama" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5A1116" />
      <stop offset="40%" stop-color="#240A0D" />
      <stop offset="100%" stop-color="#0B0A09" />
    </linearGradient>
  </defs>

  <rect width="400" height="600" fill="url(#bgDrama)" />
  <rect x="18" y="18" width="364" height="564" fill="none" stroke="#C69A45" stroke-width="1.5" />

  <text x="200" y="55" font-family="'Barlow Condensed', Impact, sans-serif" font-size="12" font-weight="bold" fill="#C69A45" text-anchor="middle" letter-spacing="5">
    KOOTHUPATTARAI THEATRE GUILD
  </text>
  <line x1="80" y1="65" x2="320" y2="65" stroke="#C69A45" stroke-width="1" opacity="0.6" />

  <!-- Theatre Comedy/Tragedy Masks -->
  <g transform="translate(200, 240)">
    <!-- Comedy Mask -->
    <g transform="translate(-35, -10) rotate(-15)">
      <ellipse cx="0" cy="0" rx="35" ry="45" fill="#F1E4C5" stroke="#0B0A09" stroke-width="2" />
      <circle cx="-12" cy="-10" r="5" fill="#0B0A09" />
      <circle cx="12" cy="-10" r="5" fill="#0B0A09" />
      <path d="M-18,12 Q0,32 18,12" fill="none" stroke="#0B0A09" stroke-width="4" stroke-linecap="round" />
    </g>
    <!-- Tragedy Mask -->
    <g transform="translate(35, 15) rotate(10)">
      <ellipse cx="0" cy="0" rx="35" ry="45" fill="#C69A45" stroke="#0B0A09" stroke-width="2" />
      <circle cx="-12" cy="-10" r="5" fill="#0B0A09" />
      <circle cx="12" cy="-10" r="5" fill="#0B0A09" />
      <path d="M-18,22 Q0,5 18,22" fill="none" stroke="#0B0A09" stroke-width="4" stroke-linecap="round" />
    </g>
  </g>

  <text x="200" y="385" font-family="'Cinzel', serif" font-size="14" fill="#C69A45" text-anchor="middle" letter-spacing="6">
    கூத்துப்பட்டறை
  </text>

  <text x="200" y="425" font-family="'Barlow Condensed', Impact, sans-serif" font-size="44" font-weight="900" fill="#F1E4C5" text-anchor="middle" letter-spacing="2">
    DRAMA &amp; SKITS
  </text>
  <text x="200" y="450" font-family="'Barlow Condensed', Impact, sans-serif" font-size="14" font-weight="bold" fill="#A51D24" text-anchor="middle" letter-spacing="4">
    LIVE THEATRICAL MADNESS
  </text>

  <rect x="35" y="480" width="330" height="75" fill="#0B0A09" stroke="#C69A45" stroke-width="1" opacity="0.85" />
  <text x="50" y="508" font-family="'Courier New', monospace" font-size="11" fill="#F1E4C5" letter-spacing="1">VENUE: MAIN AUDITORIUM</text>
  <text x="50" y="528" font-family="'Courier New', monospace" font-size="11" fill="#C69A45" letter-spacing="1">CALL TIME: 03:00 PM</text>
  <text x="50" y="546" font-family="'Courier New', monospace" font-size="11" fill="#A51D24" letter-spacing="1">MAX SQUAD: 10 ACTORS</text>
</svg>
