<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGaming" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141210" />
      <stop offset="50%" stop-color="#1A0D2E" />
      <stop offset="100%" stop-color="#0B0A09" />
    </linearGradient>
  </defs>

  <rect width="400" height="600" fill="url(#bgGaming)" />
  <rect x="18" y="18" width="364" height="564" fill="none" stroke="#C69A45" stroke-width="1.5" />

  <text x="200" y="55" font-family="'Barlow Condensed', Impact, sans-serif" font-size="12" font-weight="bold" fill="#C69A45" text-anchor="middle" letter-spacing="5">
    CAMPUS ESPORTS SHOWDOWN
  </text>
  <line x1="80" y1="65" x2="320" y2="65" stroke="#C69A45" stroke-width="1" opacity="0.6" />

  <!-- Retro Arcade & Controller Silhouette -->
  <g transform="translate(200, 240)">
    <rect x="-65" y="-35" width="130" height="70" rx="20" fill="#F1E4C5" stroke="#0B0A09" stroke-width="3" />
    <!-- D-Pad -->
    <rect x="-42" y="-18" width="12" height="36" rx="2" fill="#0B0A09" />
    <rect x="-54" y="-6" width="36" height="12" rx="2" fill="#0B0A09" />
    <!-- Action Buttons -->
    <circle cx="35" cy="-8" r="7" fill="#A51D24" />
    <circle cx="20" cy="8" r="7" fill="#C69A45" />
    <circle cx="50" cy="8" r="7" fill="#5A1116" />
    <circle cx="35" cy="24" r="7" fill="#0B0A09" />
  </g>

  <text x="200" y="385" font-family="'Cinzel', serif" font-size="14" fill="#C69A45" text-anchor="middle" letter-spacing="6">
    கேமிங் அரங்கம்
  </text>

  <text x="200" y="425" font-family="'Barlow Condensed', Impact, sans-serif" font-size="44" font-weight="900" fill="#F1E4C5" text-anchor="middle" letter-spacing="2">
    GAMING ARENA
  </text>
  <text x="200" y="450" font-family="'Barlow Condensed', Impact, sans-serif" font-size="14" font-weight="bold" fill="#A51D24" text-anchor="middle" letter-spacing="4">
    EA FC &amp; FIGHTING TOURNAMENT
  </text>

  <rect x="35" y="480" width="330" height="75" fill="#0B0A09" stroke="#C69A45" stroke-width="1" opacity="0.85" />
  <text x="50" y="508" font-family="'Courier New', monospace" font-size="11" fill="#F1E4C5" letter-spacing="1">VENUE: COMPUTER CENTRE HALL B</text>
  <text x="50" y="528" font-family="'Courier New', monospace" font-size="11" fill="#C69A45" letter-spacing="1">CALL TIME: 10:00 AM</text>
  <text x="50" y="546" font-family="'Courier New', monospace" font-size="11" fill="#A51D24" letter-spacing="1">BRACKET: 1V1 DOUBLE ELIMINATION</text>
</svg>
