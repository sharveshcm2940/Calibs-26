  </text>

  <rect x="35" y="480" width="330" height="75" fill="#0B0A09" stroke="#C69A45" stroke-width="1" opacity="0.85" />
  <text x="50" y="508" font-family="'Courier New', monospace" font-size="11" fill="#F1E4C5" letter-spacing="1">VENUE: CAMPUS QUADRANGLE</text>
  <text x="50" y="528" font-family="'Courier New', monospace" font-size="11" fill="#C69A45" letter-spacing="1">CALL TIME: 11:00 AM</text>
  <text x="50" y="546" font-family="'Courier New', monospace" font-size="11" fill="#A51D24" letter-spacing="1">SQUAD SIZE: 3 TO 4 DETECTIVES</text>
