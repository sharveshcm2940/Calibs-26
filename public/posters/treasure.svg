<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTreasure" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A1D0B" />
      <stop offset="50%" stop-color="#141210" />
      <stop offset="100%" stop-color="#0B0A09" />
    </linearGradient>
  </defs>

  <rect width="400" height="600" fill="url(#bgTreasure)" />
  <rect x="18" y="18" width="364" height="564" fill="none" stroke="#C69A45" stroke-width="1.5" />

  <text x="200" y="55" font-family="'Barlow Condensed', Impact, sans-serif" font-size="12" font-weight="bold" fill="#C69A45" text-anchor="middle" letter-spacing="5">
    THE GREAT CAMPUS INVESTIGATION
  </text>
  <line x1="70" y1="65" x2="330" y2="65" stroke="#C69A45" stroke-width="1" opacity="0.6" />

  <!-- Compass & Magnifying Glass Clue Art -->
  <g transform="translate(200, 240)">
    <circle cx="0" cy="0" r="90" fill="none" stroke="#C69A45" stroke-width="2" stroke-dasharray="4 2" />
    <!-- Compass Rose -->
    <polygon points="0,-70 15,-15 70,0 15,15 0,70 -15,15 -70,0 -15,-15" fill="#F1E4C5" />
    <polygon points="0,-70 15,-15 0,0 -15,-15" fill="#A51D24" />
    <polygon points="70,0 15,15 0,0 15,-15" fill="#5A1116" />
    <circle cx="0" cy="0" r="14" fill="#0B0A09" stroke="#C69A45" stroke-width="2" />
  </g>

  <text x="200" y="385" font-family="'Cinzel', serif" font-size="14" fill="#C69A45" text-anchor="middle" letter-spacing="6">
    வேட்டை
  </text>

  <text x="200" y="425" font-family="'Barlow Condensed', Impact, sans-serif" font-size="44" font-weight="900" fill="#F1E4C5" text-anchor="middle" letter-spacing="2">
    TREASURE HUNT
  </text>
  <text x="200" y="450" font-family="'Barlow Condensed', Impact, sans-serif" font-size="14" font-weight="bold" fill="#C69A45" text-anchor="middle" letter-spacing="4">
