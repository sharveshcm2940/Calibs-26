<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFilm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0A09" />
      <stop offset="60%" stop-color="#2D080A" />
      <stop offset="100%" stop-color="#0B0A09" />
    </linearGradient>
  </defs>

  <rect width="400" height="600" fill="url(#bgFilm)" />

  <!-- Frame border with film perforations -->
  <rect x="18" y="18" width="364" height="564" fill="none" stroke="#C69A45" stroke-width="1.5" />

  <text x="200" y="55" font-family="'Barlow Condensed', Impact, sans-serif" font-size="12" font-weight="bold" fill="#C69A45" text-anchor="middle" letter-spacing="5">
    OFFICIAL SELECTION 2026
  </text>
  <line x1="80" y1="65" x2="320" y2="65" stroke="#C69A45" stroke-width="1" opacity="0.6" />

  <!-- Clapperboard & Camera Silhouette -->
  <g transform="translate(200, 235)">
    <!-- Old 35mm Movie Camera -->
    <circle cx="-35" cy="-25" r="28" fill="#1F1B17" stroke="#C69A45" stroke-width="2" />
    <circle cx="35" cy="-25" r="28" fill="#1F1B17" stroke="#C69A45" stroke-width="2" />
    <circle cx="-35" cy="-25" r="8" fill="#A51D24" />
    <circle cx="35" cy="-25" r="8" fill="#A51D24" />
    <rect x="-45" y="0" width="90" height="65" rx="4" fill="#F1E4C5" />
    <!-- Camera Lens cone with projector light -->
    <polygon points="45,15 140,-15 140,75 45,50" fill="#C69A45" opacity="0.3" />
    <!-- Clapperboard overlay -->
    <g transform="translate(0, 50) rotate(-10)">
      <rect x="-60" y="-30" width="120" height="30" fill="#0B0A09" stroke="#F1E4C5" stroke-width="2" />
      <!-- Chevrons -->
      <polygon points="-50,-30 -40,-30 -30,0 -40,0" fill="#F1E4C5" />
      <polygon points="-20,-30 -10,-30 0,0 -10,0" fill="#F1E4C5" />
      <polygon points="10,-30 20,-30 30,0 20,0" fill="#F1E4C5" />
      <polygon points="40,-30 50,-30 60,0 50,0" fill="#F1E4C5" />
    </g>
  </g>

  <!-- Tamil Script -->
  <text x="200" y="385" font-family="'Cinzel', serif" font-size="14" fill="#C69A45" text-anchor="middle" letter-spacing="6">
    முதல் கிளாப்
  </text>

  <!-- Event Title -->
  <text x="200" y="425" font-family="'Barlow Condensed', Impact, sans-serif" font-size="42" font-weight="900" fill="#F1E4C5" text-anchor="middle" letter-spacing="2">
    FIRST CLAP
  </text>
  <text x="200" y="450" font-family="'Barlow Condensed', Impact, sans-serif" font-size="14" font-weight="bold" fill="#A51D24" text-anchor="middle" letter-spacing="4">
    SHORT FILM FESTIVAL
  </text>

  <!-- Info Box -->
  <rect x="35" y="480" width="330" height="75" fill="#0B0A09" stroke="#C69A45" stroke-width="1" opacity="0.85" />
  <text x="50" y="508" font-family="'Courier New', monospace" font-size="11" fill="#F1E4C5" letter-spacing="1">VENUE: PREVIEW THEATRE</text>
  <text x="50" y="528" font-family="'Courier New', monospace" font-size="11" fill="#C69A45" letter-spacing="1">CALL TIME: 10:00 AM</text>
  <text x="50" y="546" font-family="'Courier New', monospace" font-size="11" fill="#A51D24" letter-spacing="1">MAX RUNTIME: 7 MINUTES</text>

  <g transform="translate(325, 517)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#C69A45" stroke-width="2" stroke-dasharray="3 1" />
    <text x="0" y="4" font-family="'Barlow Condensed', Impact, sans-serif" font-size="11" font-weight="bold" fill="#C69A45" text-anchor="middle">35MM</text>
  </g>
</svg>
