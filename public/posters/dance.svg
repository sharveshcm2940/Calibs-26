<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDance" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5A1116" />
      <stop offset="60%" stop-color="#220608" />
      <stop offset="100%" stop-color="#0B0A09" />
    </linearGradient>
    <radialGradient id="spotDance" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#C69A45" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#5A1116" stop-opacity="0" />
    </radialGradient>
    <pattern id="halftoneDance" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#C69A45" opacity="0.15" />
    </pattern>
  </defs>

  <!-- Background with Vignette -->
  <rect width="400" height="600" fill="url(#bgDance)" />
  <rect width="400" height="600" fill="url(#spotDance)" />
  <rect width="400" height="600" fill="url(#halftoneDance)" />

  <!-- Film Border / Frame -->
  <rect x="15" y="15" width="370" height="570" fill="none" stroke="#C69A45" stroke-width="2" stroke-dasharray="8 4" opacity="0.4" />
  <rect x="22" y="22" width="356" height="556" fill="none" stroke="#F1E4C5" stroke-width="1" opacity="0.3" />

  <!-- Top Release Header -->
  <text x="200" y="55" font-family="'Barlow Condensed', Impact, sans-serif" font-size="12" font-weight="bold" fill="#C69A45" text-anchor="middle" letter-spacing="5">
    CALIBRATIONS 2026 SPECIAL PRESENTATION
  </text>
  <line x1="60" y1="65" x2="340" y2="65" stroke="#C69A45" stroke-width="1" opacity="0.5" />

  <!-- Central Visual: Dancing Silhouette with Dynamic Flares -->
  <g transform="translate(200, 260)">
    <!-- Aura Rays -->
    <path d="M-120,-100 L120,100 M-100,120 L100,-120 M-140,0 L140,0 M0,-140 L0,140" stroke="#A51D24" stroke-width="2" opacity="0.3" />
    <!-- Dynamic Dancer Silhouette -->
    <circle cx="0" cy="-75" r="22" fill="#F1E4C5" />
    <path d="M-20,-50 C-10,-55 10,-55 20,-50 L35,-10 C45,15 15,30 0,40 L-15,100 L-45,140 L-30,80 L-10,35 L-25,-10 Z" fill="#F1E4C5" />
    <!-- Flung Scarf / Towel (Mass Tamil Cinema Archetype) -->
    <path d="M-10,-40 Q40,-70 70,-40 Q100,-10 130,-30" fill="none" stroke="#A51D24" stroke-width="12" stroke-linecap="round" />
    <path d="M-10,-40 Q40,-70 70,-40 Q100,-10 130,-30" fill="none" stroke="#C69A45" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Tamil Script Accents -->
  <text x="200" y="380" font-family="'Cinzel', serif" font-size="14" fill="#C69A45" text-anchor="middle" letter-spacing="6">
    ஆடவடி ஸ்டெப்ஸ்
  </text>

  <!-- Big Typography: Event Name -->
  <text x="200" y="420" font-family="'Barlow Condensed', Impact, sans-serif" font-size="44" font-weight="900" fill="#F1E4C5" text-anchor="middle" letter-spacing="2">
    MASS DANCE
  </text>
  <text x="200" y="445" font-family="'Barlow Condensed', Impact, sans-serif" font-size="16" font-weight="bold" fill="#A51D24" text-anchor="middle" letter-spacing="4">
    THE ULTIMATE KUTHU CLASH
  </text>

  <!-- Bottom Details Bar -->
  <rect x="35" y="480" width="330" height="75" fill="#0B0A09" stroke="#C69A45" stroke-width="1" opacity="0.85" />
  <text x="50" y="508" font-family="'Courier New', monospace" font-size="11" fill="#F1E4C5" letter-spacing="1">VENUE: OPEN AIR THEATRE</text>
  <text x="50" y="528" font-family="'Courier New', monospace" font-size="11" fill="#C69A45" letter-spacing="1">CALL TIME: 05:00 PM</text>
  <text x="50" y="546" font-family="'Courier New', monospace" font-size="11" fill="#A51D24" letter-spacing="1">MAX SQUAD: 12 DANCERS</text>

  <!-- Censor Seal Stamp -->
  <g transform="translate(325, 517)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#A51D24" stroke-width="2" stroke-dasharray="3 1" />
    <text x="0" y="4" font-family="'Barlow Condensed', Impact, sans-serif" font-size="13" font-weight="bold" fill="#A51D24" text-anchor="middle">U/A</text>
  </g>
</svg>
