<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFashion" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141210" />
      <stop offset="50%" stop-color="#3A0D10" />
      <stop offset="100%" stop-color="#0B0A09" />
    </linearGradient>
    <radialGradient id="spotFashion" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#F1E4C5" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#141210" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="400" height="600" fill="url(#bgFashion)" />
  <rect width="400" height="600" fill="url(#spotFashion)" />

  <!-- Geometric Deco Border -->
  <rect x="18" y="18" width="364" height="564" fill="none" stroke="#C69A45" stroke-width="1.5" />
  <polygon points="18,30 30,18 42,18 18,42" fill="#C69A45" />
  <polygon points="382,30 370,18 358,18 382,42" fill="#C69A45" />
  <polygon points="18,570 30,582 42,582 18,558" fill="#C69A45" />
  <polygon points="382,570 370,582 358,582 382,558" fill="#C69A45" />

  <text x="200" y="55" font-family="'Barlow Condensed', Impact, sans-serif" font-size="12" font-weight="bold" fill="#C69A45" text-anchor="middle" letter-spacing="6">
    HAUTE COUTURE DE KOLLYWOOD
  </text>
  <line x1="70" y1="65" x2="330" y2="65" stroke="#C69A45" stroke-width="1" opacity="0.6" />

  <!-- Stylized Runway Figure -->
  <g transform="translate(200, 240)">
    <!-- Spotlight beam -->
    <polygon points="-80,-120 80,-120 130,150 -130,150" fill="#F1E4C5" opacity="0.08" />
    <!-- High-fashion silhouette with sunglasses and flowing cape -->
    <circle cx="0" cy="-60" r="16" fill="#F1E4C5" />
    <!-- Sleek sunglasses -->
    <rect x="-14" y="-62" width="28" height="6" rx="2" fill="#0B0A09" />
    <!-- Silhouette body -->
    <path d="M-15,-40 L15,-40 L28,40 L10,130 L-10,130 L-28,40 Z" fill="#F1E4C5" />
    <!-- Flowing Gold/Red Cape -->
    <path d="M-15,-38 Q-70,30 -60,110 Q-30,80 -10,35 Z" fill="#C69A45" />
    <path d="M15,-38 Q70,30 60,110 Q30,80 10,35 Z" fill="#A51D24" />
  </g>

  <!-- Tamil Script -->
  <text x="200" y="385" font-family="'Cinzel', serif" font-size="14" fill="#C69A45" text-anchor="middle" letter-spacing="6">
    ரேம்ப் ராஜா &amp; ராணி
  </text>

  <!-- Title -->
  <text x="200" y="425" font-family="'Barlow Condensed', Impact, sans-serif" font-size="44" font-weight="900" fill="#F1E4C5" text-anchor="middle" letter-spacing="2">
    FASHION WALK
  </text>
  <text x="200" y="450" font-family="'Barlow Condensed', Impact, sans-serif" font-size="15" font-weight="bold" fill="#C69A45" text-anchor="middle" letter-spacing="5">
    VINTAGE CINEMA GLAMOUR
  </text>

  <!-- Info box -->
  <rect x="35" y="480" width="330" height="75" fill="#0B0A09" stroke="#C69A45" stroke-width="1" opacity="0.85" />
  <text x="50" y="508" font-family="'Courier New', monospace" font-size="11" fill="#F1E4C5" letter-spacing="1">VENUE: MAIN AUDITORIUM</text>
  <text x="50" y="528" font-family="'Courier New', monospace" font-size="11" fill="#C69A45" letter-spacing="1">CALL TIME: 02:00 PM</text>
  <text x="50" y="546" font-family="'Courier New', monospace" font-size="11" fill="#A51D24" letter-spacing="1">TEAM SIZE: 4 TO 8 MODELS</text>

  <g transform="translate(325, 517)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#C69A45" stroke-width="2" stroke-dasharray="2 2" />
    <text x="0" y="4" font-family="'Barlow Condensed', Impact, sans-serif" font-size="11" font-weight="bold" fill="#C69A45" text-anchor="middle">SOLDOUT</text>
  </g>
</svg>
